spring.application.name=location-context-service
server.port=8081
spring.jackson.deserialization.accept-empty-string-as-null-object=true
server.error.include-message=always
server.error.include-binding-errors=always
logging.level.ru.kholodov.locationcontextservice=DEBUG
geocoding.url=https://us1.locationiq.com/v1/search
geocoding.api-key=${GEOCODING_API_KEY:}
isochrone.url=https://api.openrouteservice.org/v2/isochrones/foot-walking
isochrone.api-key=${ISOCHRONE_API_KEY:}
http.connect-timeout-ms=5000
http.read-timeout-ms=30000
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=1h

integration.places-base-url=http://localhost:8082
integration.planner-base-url=http://localhost:8083
integration.connect-timeout-ms=5000
integration.read-timeout-ms=15000

# --- Resilience4j ---
# Retry: 3 попытки, экспоненциальный backoff. Ретраим только сетевые/5xx;
# 4xx уже отсеяны в catch-блоках сервисов и наружу не пробрасываются.
resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=300ms
resilience4j.retry.configs.default.enable-exponential-backoff=true
resilience4j.retry.configs.default.exponential-backoff-multiplier=2
resilience4j.retry.configs.default.retry-exceptions[0]=org.springframework.web.client.ResourceAccessException
resilience4j.retry.configs.default.retry-exceptions[1]=org.springframework.web.client.HttpServerErrorException
resilience4j.retry.configs.default.retry-exceptions[2]=java.io.IOException

resilience4j.retry.instances.geocoding.base-config=default
resilience4j.retry.instances.isochrone.base-config=default
resilience4j.retry.instances.places.base-config=default
resilience4j.retry.instances.planner.base-config=default

# CircuitBreaker: открываем при >50% сбоев на окне из 20 вызовов,
# 10 сек в open, затем half-open с 5 пробами.
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=20
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.circuitbreaker.instances.geocoding.base-config=default
resilience4j.circuitbreaker.instances.isochrone.base-config=default
resilience4j.circuitbreaker.instances.places.base-config=default
resilience4j.circuitbreaker.instances.planner.base-config=default