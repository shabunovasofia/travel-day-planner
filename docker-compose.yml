version: '3.8'

services:
  places-service:
    build: ./places-service
    ports:
      - "8082:8082"
    environment:
      - OPENTRIPMAP_API_KEY=${OPENTRIPMAP_API_KEY}

  planner-service:
    build: ./planner-service
    ports:
      - "8083:8083"
    depends_on:
      - places-service

  location-context-service:
    build: ./location-context-service
    ports:
      - "8081:8081"
    environment:
      - GEOCODING_API_KEY=${GEOCODING_API_KEY}
      - ORS_API_KEY=${ORS_API_KEY}
    depends_on:
      - places-service
      - planner-service
