services:
  places-service:
    build: ./places-service
    ports:
      - "8082:8082"
    environment:
      - OPENTRIPMAP_API_KEY=${OPENTRIPMAP_API_KEY}

  planner-service:
    build: ./planner-service
    ports:
      - "8083:8083"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    depends_on:
      - places-service

  location-context-service:
    build: ./location-context-service
    ports:
      - "8081:8081"
    environment:
      # API-ключи внешних сервисов
      - GEOCODING_API_KEY=${GEOCODING_API_KEY}
      - ISOCHRONE_API_KEY=${ISOCHRONE_API_KEY}
      # Внутри сети compose обращение к соседям по имени сервиса, не по localhost.
      # Spring Boot relaxed binding: INTEGRATION_PLACES_BASE_URL -> integration.places-base-url.
      - INTEGRATION_PLACES_BASE_URL=http://places-service:8082
      - INTEGRATION_PLANNER_BASE_URL=http://planner-service:8083
    depends_on:
      - places-service
      - planner-service
